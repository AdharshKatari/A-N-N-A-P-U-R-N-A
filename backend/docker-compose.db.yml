version: '3.8'

services:
  freshguard-db:
    image: postgis/postgis:15-3.4
    container_name: freshguard_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fresh_admin
      POSTGRES_PASSWORD: freshguard_dev_2026
      POSTGRES_DB: freshguard_core
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fresh_admin -d freshguard_core"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
