version: '3.8'

services:
  # The Core Multimodal Intelligence Engine
  freshguard-backend:
    build: .
    container_name: freshguard_api_core
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-fresh_admin}:${POSTGRES_PASSWORD}@freshguard-db:5432/${POSTGRES_DB:-freshguard_core}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - ISRO_BHOONIDHI_USER_ID=${ISRO_BHOONIDHI_USER_ID}
      - ISRO_BHOONIDHI_PASSWORD=${ISRO_BHOONIDHI_PASSWORD}
      - PASSPORT_HMAC_SECRET=${PASSPORT_HMAC_SECRET}
      - FREELLMAPI_KEY=${FREELLMAPI_KEY}
      - FREELLMAPI_BASE_URL=${FREELLMAPI_BASE_URL:-http://localhost:3001/v1}
      - FREELLMAPI_MODEL=${FREELLMAPI_MODEL:-gemini-2.5-flash}
      - POSTGRES_USER=${POSTGRES_USER:-fresh_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-freshguard_core}
    depends_on:
      freshguard-db:
        condition: service_healthy
    networks:
      - freshguard-mesh-network
    restart: always

  # The Geographic + Time-Series Spatial Data Warehouse
  freshguard-db:
    image: timescale/timescaledb-ha:pg15-ts2.11-latest
    container_name: freshguard_spatial_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-fresh_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-freshguard_core}
    volumes:
      - pgdata_volume:/var/lib/postgresql/data
      - ./init_spatial_schema.sql:/docker-entrypoint-initdb.d/10_init_spatial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fresh_admin} -d ${POSTGRES_DB:-freshguard_core}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - freshguard-mesh-network
    restart: always

volumes:
  pgdata_volume:
    driver: local

networks:
  freshguard-mesh-network:
    driver: bridge
